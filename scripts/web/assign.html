<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assign products</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="assign.js"></script>
  </head>
  <body>
    <main id="app">
      <h1 id="title">Loading…</h1>
      <div class="assign-bar">
        <button id="not-in-store">Not in this store</button>
        <button id="skip">Skip</button>
        <button id="back">Back</button>
        <button id="done" class="primary">Done</button>
        <div class="current">
          <strong id="product" class="current-product"></strong>
          <span id="progress" class="progress"></span>
        </div>
      </div>
      <p id="status" class="status"></p>
      <div id="map" class="assign-map"></div>
    </main>
  </body>
</html>
