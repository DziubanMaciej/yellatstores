<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draw store layout</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="draw.js"></script>
  </head>
  <body>
    <main>
      <h1 id="title">Loading…</h1>
      <div class="toolbar" id="item-controls">
        <label><input type="radio" name="kind" value="section" checked /> Section</label>
        <label><input type="radio" name="kind" value="decoration" /> Decoration</label>
        <label><span id="name-label">Name</span> <input type="text" id="name" autocomplete="off" /></label>
        <label id="visible-control" hidden><input type="checkbox" id="visible" checked /> Draw box (untick for text only)</label>
      </div>
      <div class="toolbar">
        <button id="undo">Undo</button>
        <button id="more-space">More space</button>
        <button id="cancel">Cancel</button>
        <button id="done" class="primary">Done</button>
      </div>
      <p id="status" class="status"></p>
      <div id="canvas"></div>
    </main>
  </body>
</html>
