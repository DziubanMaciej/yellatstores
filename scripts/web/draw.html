<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store layout</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="draw.js"></script>
  </head>
  <body>
    <main>
      <h1 id="title">Loading…</h1>
      <div class="toolbar">
        <button id="undo">Undo</button>
        <button id="more-space">More space</button>
        <button id="cancel">Cancel</button>
        <button id="done" class="primary">Done</button>
      </div>
      <p id="status" class="status"></p>
      <div id="canvas"></div>
    </main>

    <dialog id="item-dialog">
      <form id="item-form">
        <h2 id="dialog-title"></h2>
        <p class="kinds" id="kinds">
          <label><input type="radio" name="kind" value="section" checked /> Section</label>
          <label><input type="radio" name="kind" value="decoration" /> Decoration</label>
        </p>
        <p>
          <label><span id="name-label">Name</span><br /><input type="text" id="name" autocomplete="off" /></label>
        </p>
        <p id="visible-control" hidden>
          <label><input type="checkbox" id="visible" checked /> Draw box (untick for text only)</label>
        </p>
        <p id="dialog-error" class="status error"></p>
        <div class="toolbar">
          <button type="button" id="dialog-cancel">Cancel</button>
          <button type="submit" class="primary" id="dialog-submit">Add</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
